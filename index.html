:root{--c:#7de3ff;--c2:#c87dff;--gold:#ffd166;--red:#ff6a5a;--grn:#6fe08a;--pn:rgba(13,21,33,.74);--ln:rgba(125,227,255,.22);--tx:#d8e6f2;--dim:#8296a8;--fs:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#05070c;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
body{font-family:'Exo 2',system-ui,sans-serif;color:var(--tx)}
#app{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;transform-origin:0 0;font-size:calc(15px*var(--fs));line-height:1.4}
#glCanvas,#gameCanvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#glCanvas{z-index:0;visibility:hidden}
#gameCanvas{z-index:1}
#touchUI{position:absolute;left:0;top:0;width:100%;height:100%;z-index:2;pointer-events:none;display:none;touch-action:none}
#touchUI.edit{z-index:7}
.tb,.stick{position:absolute;transform:translate(-50%,-50%);border-radius:50%;pointer-events:auto;touch-action:none}
.tb{display:flex;align-items:center;justify-content:center;border:2px solid rgba(125,227,255,.5);background:rgba(8,18,30,.42);color:#d6f3ff;font-family:Orbitron,sans-serif;font-weight:700;letter-spacing:.06em;box-shadow:0 0 14px rgba(125,227,255,.18) inset}
.tb.on{background:rgba(125,227,255,.34);border-color:#fff}
.tb[data-id=fire]{border-color:rgba(255,120,90,.75);color:#ffd9d0}
.tb[data-id=burner]{border-color:rgba(255,190,90,.7)}
.stick{border:2px solid rgba(125,227,255,.35);background:radial-gradient(circle,rgba(125,227,255,.10),rgba(8,18,30,.30))}
.stick i{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;background:rgba(125,227,255,.38);border:2px solid rgba(255,255,255,.55)}

 const T={first:[c.wins,1],ram:[c.ram,10],boss:[c.boss,1],sector:[c.sectors,1],sec10:[c.sectors,10],
  mEsc:[c.wEsc,1],mHun:[c.wHun,1],mDef:[c.wDef,1],mTot:[c.wTot,1],dPil:[c.wPil,1],dAce:[c.wAce,1],dAceB:[c.bAce,1],flaw10:[c.flaw,10],
  sh5:[save.ships.length,5],sh15:[save.ships.length,SHIPS.length],pt10:[save.hulls.length,10],ptAll:[save.hulls.length,HULLS.length],tr5:[save.trails.length,5],trAll:[save.trails.length,TRAILS.length],
  upMax:[UPK.some(u=>save.up[u]>=UPG[u].max)?1:0,1],wing6:[save.up.wing,6]};
 if(T[id])return T[id];if(!k)return null;

function sanitize(d){
 const s=newSave('Pilot');if(!d||typeof d!=='object')return s;
 s.name=String(d.name||'Pilot').slice(0,16);s.gold=Math.max(0,+d.gold||0);
 for(const k of UPK)s.up[k]=clamp((d.up&&+d.up[k])|0,0,UPG[k].max);
 for(const df in DIFFS){const src=d.prog&&d.prog.campaign&&d.prog.campaign[df];if(src)for(const k in src){const lv=+k,st=src[k]&&+src[k].stars;if(lv>=1&&lv<=500&&st>0)s.prog.campaign[df][lv]={stars:clamp(st|0,1,3)};}}

 if(d.ach)for(const a of DEEDS)if(d.ach[a.id])s.ach[a.id]=1;
 const list=(a,n)=>{const o=[0];if(Array.isArray(a))for(const v of a)if(Number.isInteger(v)&&v>0&&v<n&&!o.includes(v))o.push(v);return o;};

 s.hull=s.hulls.includes(d.hull)?d.hull:0;s.trail=s.trails.includes(d.trail)?d.trail:0;s.ship=s.ships.includes(d.ship)?d.ship:0;
 s.best=Math.max.apply(null,s.ships);
 if(d.mods)for(const k in d.mods){const i=+k;if(i>=0&&i<SHIPS.length&&Array.isArray(d.mods[k]))s.mods[i]=d.mods[k].filter(v=>Number.isInteger(v)&&v>=0&&v<MODS.length);}

function starsOf(lv,diff){const o=save.prog.campaign[diff||save.diff][lv];return o?o.stars:0;}
function reached(){if(save.free)return 500;let m=0;for(const d in save.prog.campaign){const o=save.prog.campaign[d];for(const k in o)if(o[k].stars>0&&+k>m)m=+k;}return Math.min(500,m+1);}
function isOpen(lv){return save.free||lv===1||starsOf(lv-1)>0;}
function sectorStars(sea){let n=0;for(let m=1;m<=50;m++)n+=starsOf(sea*50+m);return n;}
function sectorCleared(sea,diff){for(let m=1;m<=50;m++)if(!starsOf(sea*50+m,diff))return false;return true;}
function upCost(k){const l=save.up[k];if(k==='wing')return WING_COST[Math.min(l,WING_COST.length-1)];return Math.round(UPG[k].base*(l+1)*(1+l*.15));}
function wingCount(){return Math.min(6,save.up.wing);}
function upLock(k){const l=save.up[k];if(k==='wing'&&l<UPG.wing.max&&reached()<=WING_AT[l])return'Unlocks after mission '+WING_AT[l];if(k==='squad'&&save.up.wing<1)return'Needs a wingmate first';return'';}
function modeFor(m){return m%10===0?'boss':m%10===3?'escort':m%10===5?'hunted':m%10===7?'totalwar':m%10===9?'defend':'battle';}
function starTimes(mode,sea){return mode==='defend'?[120+sea*20,180+sea*30]:MODES[mode].t;}
function missionReward(lv,mode,diff){return Math.round((200+lv*10)*DIFFS[diff].r*MODES[mode].bonus);}
function loreFor(lv){const sea=(lv-1)/50|0,m=(lv-1)%50+1;if(m===1)return SEAS[sea].intro;if(m===50)return SEAS[sea].boss+' holds the far end of this sector. Nothing leaves without passing that guns.'.replace('that guns','those guns');if(m%10===0)return'A lieutenant of '+SEAS[sea].boss+' commands here. Break the line and the sector opens further.';return LORE[(lv*7+sea)%LORE.length];}

const AU={ctx:null,mg:null,sg:null,nb:null,mf:null,rum:null,rumF:null,last:{},step:0,next:0};
function audioInit(){
 if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume().catch(()=>{});return;}
 try{
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  const c=AU.ctx=new C(),comp=c.createDynamicsCompressor();comp.connect(c.destination);
  AU.mg=c.createGain();AU.sg=c.createGain();AU.mg.connect(comp);AU.sg.connect(comp);
  AU.mf=c.createBiquadFilter();AU.mf.type='lowpass';AU.mf.frequency.value=1100;AU.mf.connect(AU.mg);
  const nb=AU.nb=c.createBuffer(1,c.sampleRate,c.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const src=c.createBufferSource();src.buffer=nb;src.loop=true;
  AU.rumF=c.createBiquadFilter();AU.rumF.type='lowpass';AU.rumF.frequency.value=130;
  AU.rum=c.createGain();AU.rum.gain.value=0;src.connect(AU.rumF);AU.rumF.connect(AU.rum);AU.rum.connect(AU.sg);src.start();
  setVol();AU.next=c.currentTime+.1;
 }catch(e){AU.ctx=null;}
}
function setVol(){if(!AU.ctx)return;AU.mg.gain.value=audioSet.music*.5;AU.sg.gain.value=audioSet.sfx*.85;}
function tone(type,f0,f1,dur,vol,when,dest){
 const c=AU.ctx;if(!c||vol<=0)return;const t=c.currentTime+(when||0),o=c.createOscillator(),g=c.createGain();
 o.type=type;o.frequency.setValueAtTime(f0,t);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g);g.connect(dest||panOut());o.start(t);o.stop(t+dur+.03);
}
function noiz(dur,vol,f0,f1,when,type,dest){
 const c=AU.ctx;if(!c||vol<=0)return;const t=c.currentTime+(when||0),s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
 s.buffer=AU.nb;s.loop=true;f.type=type||'lowpass';f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);

 s.connect(f);f.connect(g);g.connect(dest||panOut());s.start(t,Math.random()*.5);s.stop(t+dur+.03);

function sfx(n,v){
 const c=AU.ctx;if(!c||c.state!=='running'||audioSet.sfx<=0)return;v=v===undefined?1:v;
 const now=c.currentTime;if(now-(AU.last[n]||-1)<(n==='vulcan'?.055:.035))return;AU.last[n]=now;
 switch(n){
  case'laser':tone('sawtooth',1500,380,.11,.13*v);tone('square',2200,900,.06,.05*v);break;
  case'beam':tone('sawtooth',300,900,.32,.16*v);tone('sine',1200,1800,.3,.08*v);noiz(.3,.08*v,3000,800);break;
  case'ion':tone('sine',700,220,.22,.16*v);tone('triangle',1400,500,.16,.07*v);break;
  case'plasma':tone('sawtooth',160,70,.3,.2*v);noiz(.25,.1*v,900,200);break;
  case'vulcan':noiz(.045,.12*v,2600,1200,0,'bandpass');tone('square',240,120,.04,.06*v);break;
  case'flak':noiz(.22,.3*v,1800,300);tone('square',180,60,.18,.12*v);break;
  case'boom':noiz(.7,.5*v,900,60);tone('sine',110,30,.6,.4*v);break;
  case'bigboom':noiz(1.4,.7*v,700,40);tone('sine',80,22,1.2,.5*v);tone('sawtooth',60,25,.9,.2*v);break;
  case'hit':noiz(.08,.16*v,2400,700);break;
  case'shield':tone('sine',900,1500,.12,.1*v);tone('triangle',1800,1200,.1,.05*v);break;
  case'coin':tone('square',1320,1320,.06,.07*v);tone('square',1980,1980,.12,.07*v,.06);break;
  case'power':tone('triangle',520,1040,.18,.12*v);tone('triangle',780,1560,.2,.1*v,.08);break;
  case'warn':tone('square',880,880,.09,.1*v);tone('square',880,880,.09,.1*v,.16);break;
  case'click':tone('triangle',900,700,.04,.07*v);break;
  case'alarm':tone('square',660,660,.12,.09);tone('square',440,440,.12,.09,.14);break;
  case'streak':{const sf=520*Math.pow(2,v/12);tone('triangle',sf,sf*1.5,.16,.11);tone('sine',sf*2,sf*3,.12,.05,.05);break;}
  case'roll':noiz(.3,.14,600,2400,0,'bandpass');break;
  case'buy':tone('triangle',660,990,.1,.1*v);tone('triangle',990,1320,.14,.1*v,.08);break;
  case'deny':tone('sawtooth',160,110,.14,.1*v);break;
  case'charge':tone('sine',300,1100,.6,.05*v);break;
  case'thunder':noiz(1.1,.6*v,400,50);noiz(.15,.4*v,5000,1500);break;
  case'lock':tone('square',1200,1200,.04,.06*v);tone('square',1600,1600,.05,.06*v,.05);break;
  case'win':[0,4,7,12,16].forEach((s,i)=>{const f=523.25*Math.pow(2,s/12);tone('square',f,f,i===4?.5:.14,.09,i*.12);tone('triangle',f/2,f/2,i===4?.5:.14,.09,i*.12);});break;
  case'lose':[0,-2,-5,-9].forEach((s,i)=>{const f=330*Math.pow(2,s/12);tone('sawtooth',f,f,.3,.08,i*.22);});break;
 }
}

function musicTick(){
 const c=AU.ctx;if(!c||c.state!=='running')return;
 if(audioSet.music<=0){AU.next=c.currentTime+.1;return;}
 const spb=60/132/4;if(AU.next<c.currentTime-.4)AU.next=c.currentTime+.05;
 let n=0;while(AU.next<c.currentTime+.16&&n++<8){musicStep(AU.step++,AU.next-c.currentTime);AU.next+=spb;}
}
function musicStep(st,when){
 const inGame=(state==='play'||state==='pause')&&M,sea=inGame?M.sea:0,combat=state==='play';
 const root=40+[0,3,-2,5,2,-4,7,1,-1,4][sea],bar=(st>>4)&3,s=st&15;
 const off=[0,-4,3,-2][bar],tri=bar===0?[0,3,7]:[0,4,7];
 const f=n=>440*Math.pow(2,(n-69)/12);
 if(s===0||s===3||s===6||s===8||s===11||s===14){const b=f(root+off-(s===8?0:0));tone('sawtooth',b,b,.17,.2,when,AU.mf);tone('triangle',b/2,b/2,.2,.22,when,AU.mg);}
 const pat=[0,1,2,1,2,0,1,2,0,2,1,2,0,1,2,1],nt=root+off+tri[pat[s]]+12+(s&8?12:0)+(combat&&(st>>6)&1?12:0);
 tone(combat?'square':'triangle',f(nt),f(nt),.11,combat?.035:.05,when,AU.mf);
 if(s%4===0&&(st>>4)%8>=4){const p=f(root+off+tri[(s>>2)%3]+24);tone('sine',p,p,.4,.03,when,AU.mg);}

function pickTarget(s,range,arc){

 for(const f of foes){if(f.dead)continue;const sc=inArc(s,f,range,arc);if(sc>=0&&sc<bs){bs=sc;best=f;}}

}

}
function rayCircle(ox,oy,dx,dy,cx,cy,r){

}
/* Player laser by Weapons level L: pulse every max(12, 20-0.3L) ticks (3.0/s at L0, 5.0/s from L27),
   full charge in max(24, 40-0.6L) ticks, pulse 8+0.38L, beam 22+1.1L, aim cone 15 deg wider than other weapons. */

 const dx=Math.cos(ang),dy=Math.sin(ang),zt=pl?.8:.6,hr=pl?1.05:.9,pad=pl?(charged?10:5):0;

 const foes=s.team?team0:enemies;

function avoid(s,h,inp,ign){

 const test=(o,R,thr)=>{
  if(o===ign||o.dead)return;if(thr&&s.z>thr+.05)return;
  const ox=o.x-s.x,oy=o.y-s.y,d=Math.hypot(ox,oy)-R-s.r;if(d>look)return;
  const fwd=ox*chh+oy*shh;if(fwd<-R)return;
  const lat=ox*shh-oy*chh;
  if(Math.abs(lat)<R+s.r+50){const k=clamp(1-d/look,0,1);steer+=(lat>0?1:-1)*k*1.5;if(thr&&d<150)inp.climb=true;}
 };

}
function aiPick(s,foes){

  if(s.team===0&&player&&!player.dead&&Math.hypot(f.x-player.x,f.y-player.y)>1250)continue;
  if(s.team===1){if(f.cargo)d*=.35;else if(f.isPlayer)d*=.92;}else if(f.marked||f.boss)d*=.8;
  if(d<bs){bs=d;best=f;}

  const d=Math.hypot(es.x-s.x,es.y-s.y);
  if(s.team===0){if(!best&&player&&Math.hypot(es.x-player.x,es.y-player.y)<1250)best=es;}
  else if(d*1.9<bs&&M.mode!=='escort')best=es;

function drawPreviews(){
 if(state==='play')return;const list=document.querySelectorAll('#ui canvas.pv');if(!list.length)return;
 const use3=!!(window.R3D&&R3D.ready&&!R3D.failed&&settings.gfx!=='classic');
 for(const el of list){
  const r=el.getBoundingClientRect();if(r.bottom<0||r.top>window.innerHeight||r.right<0||r.left>window.innerWidth||r.width<4)continue;
  const idx=+el.dataset.idx,cols={hull:el.dataset.hull||HULLS[save.hull].c,trail:el.dataset.trail||TRAILS[save.trail].c};
  cols.prism=el.dataset.prism==='1'||(!el.dataset.trail&&!!TRAILS[save.trail].rb);if(cols.prism)cols.trail=prismHex(performance.now()/16);
  let ok=false;if(use3){try{ok=R3D.preview(el,idx,cols);}catch(e){ok=false;}}
  if(!ok){const x=el.getContext('2d'),w=el.width,h=el.height;x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,w,h);x.save();x.translate(w/2,h/2);x.scale(1,TILT);x.rotate(performance.now()*.0006+idx);const sc=h*.3*(.72+.25*SHIPS[idx].sc);x.scale(sc,sc);drawShip2D(x,idx,cols.hull,cols.trail,.6,0,false);x.restore();}
 }
}

function show(name,arg,keep){

function fmtNum(n){return Math.round(n).toLocaleString('en-US');}

function launchMission(lv,hunt){startMission(lv,hunt);state='play';show('');acc=0;if(touchOn&&!TEL)buildTouch();layoutTouch();audioInit();}
function leaveMission(){state='menu';M=null;player=null;lockT=null;layoutTouch();}
function checkDeeds(r){
 const got=[];r=r||{};
 const ev={nohit:r.win&&r.noHit,flawless:r.win&&r.noHit&&r.stars===3,swift:r.win&&r.secs<20,swift15:r.win&&r.secs<15};
 for(const d of DEEDS){if(save.ach[d.id])continue;let ok=ev[d.id];if(ok===undefined){const p=deedProg(d.id);ok=!!p&&p[0]>=p[1];}if(ok){save.ach[d.id]=1;save.gold+=d.g;got.push(d);}}
 return got;
}
/* collection deeds can be earned in the hangar: check after each purchase */
function deedPing(){if(!save||save.free)return;const g=checkDeeds();if(g.length){persist();sfx('buy');toast('Deed earned: '+g.map(d=>d.n).join(', ')+' (+◈ '+fmtNum(g.reduce((a,d)=>a+d.g,0))+')');}}
function showEnd(){
 const m=M,win=m.win,hunt=m.hunt,secs=m.clock/60;let stars=0,reward=0,deeds=[];
 if(win){const st=starTimes(m.mode,m.sea);stars=secs<st[0]?3:secs<st[1]?2:1;reward=hunt?Math.round((m.kills*10+150)*m.D.r):missionReward(m.lv,m.mode,m.diff);}
 else if(hunt)reward=Math.round(m.kills*5*m.D.r);
 const total=reward+m.gold;
 if(!save.free){
  const c=save.cnt;save.gold+=total;c.gold+=total;c.voy++;
  if(hunt)c.hunt=Math.max(c.hunt,m.kills);
  if(win){
   c.wins++;if(m.mode==='boss')c.boss++;
   if(!hunt){const mk={escort:'wEsc',hunted:'wHun',defend:'wDef',totalwar:'wTot'}[m.mode];if(mk)c[mk]++;if(m.diff==='pilot')c.wPil++;if(m.diff==='ace'){c.wAce++;if(m.mode==='boss')c.bAce++;}if(m.noHit&&stars===3)c.flaw++;}
   if(!hunt){const o=save.prog.campaign[m.diff],old=o[m.lv]?o[m.lv].stars:0;if(stars>old)o[m.lv]={stars};let n=0;for(let s=0;s<10;s++)if(sectorCleared(s,m.diff))n++;c.sectors=Math.max(c.sectors,n);}
  }
  deeds=checkDeeds({win,noHit:m.noHit,stars,secs,hunt,kills:m.kills});
