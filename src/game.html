<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05070c">
<title>Parsec Chronicles 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
:root{--c:#7de3ff;--c2:#c87dff;--gold:#ffd166;--red:#ff6a5a;--grn:#6fe08a;--pn:rgba(13,21,33,.74);--ln:rgba(125,227,255,.22);--tx:#d8e6f2;--dim:#8296a8;--fs:1;--u:1;--app-w:100vw;--app-h:100dvh}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#05070c;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
body{font-family:'Exo 2',system-ui,sans-serif;color:var(--tx)}
#app{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;transform-origin:0 0;font-size:calc(clamp(14px,calc(15px*var(--u)),18px)*var(--fs));line-height:1.4}
#glCanvas,#gameCanvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#glCanvas{z-index:0;visibility:hidden}
#gameCanvas{z-index:1}
#touchUI{position:absolute;left:0;top:0;width:100%;height:100%;z-index:2;pointer-events:none;display:none;touch-action:none}
#touchUI.edit{z-index:7}
#touchUI .tb,#touchUI .stick,#touchUI #thrLever{opacity:var(--tbo,1);transition:opacity .12s}#touchUI .tb.on{opacity:max(var(--tbo,1),.85)}#touchUI.edit .tb,#touchUI.edit .stick{opacity:1}
body.bigmap #touchUI .tb{opacity:0;pointer-events:none}body.bigmap #toast{visibility:hidden}
.tb,.stick{position:absolute;transform:translate(-50%,-50%);border-radius:50%;pointer-events:auto;touch-action:none}
.tb{display:flex;align-items:center;justify-content:center;border:2px solid rgba(125,227,255,.5);background:rgba(8,18,30,.42);color:#d6f3ff;font-family:Orbitron,sans-serif;font-weight:700;letter-spacing:.06em;box-shadow:0 0 14px rgba(125,227,255,.18) inset}
.tb.on{background:rgba(125,227,255,.34);border-color:#fff}
.tb[data-id=fire]{border-color:rgba(255,120,90,.75);color:#ffd9d0}
.tb[data-id=burner]{border-color:rgba(255,190,90,.7)}
.stick{border:2px solid rgba(125,227,255,.35);background:radial-gradient(circle,rgba(125,227,255,.10),rgba(8,18,30,.30))}
.stick i{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;background:rgba(125,227,255,.38);border:2px solid rgba(255,255,255,.55)}
#touchUI.edit .tb,#touchUI.edit .stick{border-style:dashed;border-color:var(--gold);background:rgba(40,30,8,.55)}
#ui{position:absolute;left:0;top:0;width:100%;height:100%;z-index:5;display:none;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:radial-gradient(120% 90% at 50% 0%,rgba(10,28,46,.5),rgba(3,5,10,.84))}
#ui.on{display:block}
#ui.clear{background:rgba(3,6,12,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#ui.float{background:none;pointer-events:none}
#ui.float .panel{pointer-events:auto}
.scr{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:1.1em 1em 2.2em;gap:.9em}
.scr.mid{justify-content:center}
.scr.mid>.panel{max-height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 8px);overflow-y:auto;overscroll-behavior:contain}
h1,h2,h3,.orb{font-family:Orbitron,sans-serif;letter-spacing:.12em;margin:0;text-transform:uppercase;font-weight:700}
h2{font-size:1.35em;color:#fff}
h3{font-size:.95em;color:var(--c)}
p{margin:.35em 0}
.logo{font-family:Orbitron,sans-serif;font-weight:900;font-size:clamp(30px,8.2vmin,88px);line-height:1;letter-spacing:.1em;text-align:center;color:#fff;text-shadow:0 0 28px rgba(125,227,255,.65),0 0 2px #7de3ff}
.logo small{display:block;font-size:.34em;letter-spacing:.5em;color:var(--c);margin-top:.5em;font-weight:700}
.logo em{font-style:normal;color:var(--gold);text-shadow:0 0 24px rgba(255,209,102,.7)}
.tagline{color:var(--dim);max-width:34em;text-align:center}
.panel{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:1em 1.1em;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 40px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.03) inset;width:100%;max-width:980px}
.panel.narrow{max-width:520px}
.hdr{display:flex;align-items:center;gap:.8em;width:100%;max-width:980px}
.fsb{display:inline-flex;align-items:center;justify-content:center;gap:.45em;flex:0 0 auto}.hdr .fsb{margin-left:auto}.hdr .cr+.fsb{margin-left:.2em}
.fsb.corner{position:absolute;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));z-index:3;font-size:1em;padding:.6em 1em;border-color:var(--acc,#7de3ff)}
.fsb.wide{width:100%}
@media (max-width:700px){.hdr .fsb .fsl{display:none}.hdr .fsb{padding:.45em .6em}}
.hdr h2{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr{font-family:Orbitron,sans-serif;font-weight:700;color:var(--gold);white-space:nowrap}
.cr:before{content:'◈ ';opacity:.8}
button{font-family:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;font-family:Orbitron,sans-serif;font-weight:700;font-size:.82em;letter-spacing:.12em;text-transform:uppercase;padding:.85em 1.3em;border-radius:10px;border:1px solid var(--ln);background:linear-gradient(180deg,rgba(40,70,100,.5),rgba(16,28,44,.7));color:#e6f6ff;cursor:pointer;transition:transform .08s,border-color .15s,box-shadow .15s;min-height:2.9em}
#ui .btn:focus-visible,#ui button:focus-visible{outline:2px solid #7de3ff;outline-offset:3px;box-shadow:0 0 0 5px rgba(125,227,255,.16),0 0 22px rgba(125,227,255,.35)}
#ui .btn:focus:not(:focus-visible),#ui button:focus:not(:focus-visible){outline:none}
html.kbnav #ui button:focus,#ui button.kb{outline:2px solid #7de3ff;outline-offset:3px;box-shadow:0 0 0 5px rgba(125,227,255,.2),0 0 26px rgba(125,227,255,.45)}
.btn:hover{border-color:var(--c);box-shadow:0 0 18px rgba(125,227,255,.25)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#2aa7cf,#136a8e);border-color:#9fe9ff;color:#fff;box-shadow:0 0 22px rgba(60,180,230,.35)}
.btn.gold{background:linear-gradient(180deg,#b88a2a,#7a5914);border-color:#ffe09a}
.btn.warn{border-color:rgba(255,110,90,.5);color:#ffb7ac}
.abortwarn{margin:.35em 0 .55em;padding:.65em .75em;border:1px solid rgba(255,110,90,.38);border-radius:10px;background:rgba(72,22,18,.38);color:#ffc7bd;font-size:.86em;line-height:1.35;text-align:left}
.btn.sm{padding:.5em .8em;font-size:.72em;min-height:2.3em}
.btn.on{background:linear-gradient(180deg,#2aa7cf,#136a8e);border-color:#bff2ff;color:#fff}
.btn.dis,.btn:disabled{opacity:.38;pointer-events:none;filter:grayscale(.6)}
.btn.wide{width:100%}
.row{display:flex;gap:.6em;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}
.col{display:flex;flex-direction:column;gap:.6em}
.grid{display:grid;gap:.7em;width:100%}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))}
.card{background:rgba(10,18,30,.66);border:1px solid var(--ln);border-radius:12px;padding:.8em .9em;display:flex;flex-direction:column;gap:.45em;position:relative;overflow:hidden}
.card.sel{border-color:var(--c);box-shadow:0 0 18px rgba(125,227,255,.22)}
.card.lock{opacity:.55}
.dim{color:var(--dim)}
.sml{font-size:.84em}
.kv{display:flex;justify-content:space-between;gap:1em;font-size:.88em}
.kv span{color:var(--dim)}
.kv b{color:#fff;font-weight:600}
.tag{display:inline-block;font-family:Orbitron,sans-serif;font-size:.62em;letter-spacing:.12em;padding:.25em .6em;border-radius:99px;border:1px solid var(--ln);color:var(--c);text-transform:uppercase}
.tag.g{color:var(--gold);border-color:rgba(255,209,102,.45)}
.tag.r{color:var(--red);border-color:rgba(255,106,90,.45)}
.stars{color:var(--gold);letter-spacing:.12em;text-shadow:0 0 10px rgba(255,209,102,.5)}
.stars i{font-style:normal;color:#3c4654;text-shadow:none}
.stars.big{font-size:3em;line-height:1}
.tabs{display:flex;gap:.4em;flex-wrap:wrap;justify-content:center}
.hubnav{position:sticky;top:0;z-index:4;display:flex;gap:.3em;flex-wrap:wrap;justify-content:center;padding:.45em .4em;margin:0 0 .6em;background:rgba(7,13,22,.93);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--ln);border-radius:10px}
.hubnav .btn.sm{padding:.5em .75em;font-size:.8em}
.manualnav{position:sticky;top:0;z-index:4;display:flex;gap:.3em;flex-wrap:wrap;justify-content:center;padding:.5em;margin-bottom:.7em;background:rgba(7,13,22,.93);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--ln);border-radius:10px}
.setbar{position:sticky;top:0;z-index:3;display:flex;flex-direction:column;gap:.5em;padding:.55em .6em;margin:-.2em 0 .5em;background:rgba(7,13,22,.94);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--ln);border-radius:10px}
.setsearch{font-size:.95em;padding:.5em .7em}
.setscr{height:calc(100dvh - 16px);min-height:0;padding-top:.5em;padding-bottom:.3em;justify-content:flex-start}
.setgroup{margin-top:.2em}
.setcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:0 1.4em;height:calc(100dvh - 234px);min-height:110px;overflow:hidden;width:100%}
.setpanel{flex:1 1 auto;min-height:0;height:auto;width:100%;max-width:1040px;display:flex;flex-direction:column;gap:.1em}
.setwrap{display:flex;gap:.7em;flex:1 1 auto;min-height:0;width:100%}
.setnav{flex:0 0 158px;display:flex;flex-direction:column;gap:.3em;overflow-y:auto;padding-right:2px}
.setnav .btn{justify-content:flex-start;text-align:left;padding:.5em .6em;font-size:.78em}
.setpane{flex:1 1 auto;min-height:120px;overflow-y:auto;overflow-x:hidden;padding-right:6px}
.settabs{justify-content:flex-start;gap:.25em}
.settabs .btn{padding:.34em .55em;font-size:.74em}
.setnote{font-size:.72em;line-height:1.3;color:var(--dim);margin:.15em 0 .45em}
.setcol{overflow-y:auto;overflow-x:hidden;min-height:0;padding-right:6px}
.setcol .set{flex-wrap:wrap;gap:.4em;align-items:flex-start}
.setcol .set>span{flex:1 1 100%;margin-bottom:.05em}
.setcol .seg{width:100%}
.setcol .seg .btn{padding:.45em .55em;font-size:.78em;min-height:1.9em}
.setcol .set input[type=range]{flex:1 1 60px}
/* settings stays two columns at every width (app rotates for landscape) */
/* boot sequences */
#bootseq{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#0b1626,#04080f 72%);font-family:Orbitron,sans-serif;color:#cfe6f5;transition:opacity .4s}
#bootseq.out{opacity:0}
.bootinner{width:min(520px,84vw)}
.boottitle{font-size:clamp(18px,3.4vw,30px);font-weight:900;letter-spacing:.16em;color:#eaf6ff;text-shadow:0 0 18px rgba(125,227,255,.5)}
.bootsub{font-size:.62em;letter-spacing:.34em;color:#7de3ff;margin:.45em 0 1.4em}
.bootlines{min-height:7.4em;font-family:"Exo 2",sans-serif;font-size:.88em;line-height:1.9;color:#9fd0e6}
.bootline{animation:bootIn .3s ease both}
.bootline span{color:#ffd166;margin-right:.5em}
.bootbar{height:4px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin-top:1em}
.bootbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7de3ff,#5fe08a);transition:width .25s}
.bootskip{font-family:"Exo 2",sans-serif;font-size:.68em;color:#5f7688;letter-spacing:.12em;margin-top:.9em;text-align:right}
@keyframes bootIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
#mintro{position:fixed;inset:0;z-index:9998;display:flex;align-items:center;justify-content:center;pointer-events:none;font-family:Orbitron,sans-serif;color:#dff1fb;transition:opacity .45s;background:radial-gradient(circle at 50% 50%,rgba(4,9,16,.5),rgba(4,9,16,.9))}
#mintro.out{opacity:0}
.mint{text-align:center;animation:bootIn .4s ease both}
.mint .mt{font-size:1.6em;font-weight:900;letter-spacing:.12em;text-shadow:0 0 16px rgba(125,227,255,.4)}
.mint .ms{font-size:.68em;letter-spacing:.3em;color:#7de3ff;margin-top:.5em}
.mint .ml{height:3px;width:min(320px,60vw);background:rgba(255,255,255,.1);border-radius:2px;margin:1em auto 0;overflow:hidden}
.mint .ml i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#7de3ff,#ffd166);transform-origin:left;animation:msw .9s ease both}
@keyframes msw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.setempty{padding:1.2em .4em;text-align:center}
.mstat{display:flex;flex-direction:column;gap:.1em;margin:.2em 0 .5em;padding:.5em .7em;border:1px solid var(--ln);border-radius:10px;background:rgba(8,16,28,.5);text-align:left}
.qset{display:flex;flex-direction:column;gap:.1em;width:100%;margin:.2em 0;padding:.5em .7em;border:1px solid var(--ln);border-radius:10px;background:rgba(8,16,28,.5)}
.qset .set{padding:.3em 0}
.qset .set>span{flex-basis:7.5em}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));gap:.7em;width:100%}
.menu .btn{flex-direction:column;padding:1.2em .8em;font-size:.9em}
.menu .btn small{font-family:'Exo 2',sans-serif;font-weight:400;letter-spacing:.02em;text-transform:none;color:#b9cfdf;font-size:.82em}
.sec{min-height:8.6em;cursor:pointer;border:1px solid var(--ln);text-align:left;color:inherit}
.sec:hover{border-color:var(--c)}
.sec .n{font-family:Orbitron,sans-serif;font-size:2.2em;font-weight:900;opacity:.22;position:absolute;right:.3em;top:.05em}
.mgrid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:.4em;width:100%}
.mis{aspect-ratio:1/1;min-height:3.4em;border-radius:9px;border:1px solid var(--ln);background:rgba(14,26,42,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.05em;cursor:pointer;padding:.15em;line-height:1.15}
.mis b{font-family:Orbitron,sans-serif;font-size:.95em;color:#fff}
.mis i{font-style:normal;font-size:.8em;color:var(--c)}
.mis .stars{font-size:.62em;letter-spacing:0}
.mis:hover{border-color:var(--c)}
.mis.dis{opacity:.3;pointer-events:none}
.mis.boss{border-color:rgba(255,106,90,.6);background:rgba(50,16,18,.75)}
.mis.sp{border-color:rgba(255,209,102,.4)}
.pv{width:100%;aspect-ratio:13/8;display:block;border-radius:8px;background:radial-gradient(circle at 50% 60%,rgba(60,110,150,.28),rgba(6,10,16,.6))}
.statbar{height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
/* build 91: win/defeat buttons always sit in one row; they share the width and long labels wrap inside the button */
.endbtns{flex-wrap:nowrap;width:100%;gap:.45em;align-items:stretch}.endbtns .btn{flex:1 1 0;min-width:0;padding-left:.45em;padding-right:.45em;white-space:normal;line-height:1.15}
@media (max-width:420px),(max-height:420px){.endbtns .btn{font-size:.82em;letter-spacing:.04em}}
/* build 91: upgrade cards share one layout: title, level tag, text, optional magnet line, then bar + button pinned to the bottom so every card in a row lines up */
.ucard{gap:.4em}.ucard h3{margin:0;line-height:1.15;overflow-wrap:anywhere}.ucard>.tag{align-self:flex-start}.ucard .ud{flex:0 0 auto}
.ucard .umg{color:#b06bff}.ucard .umg b{font-weight:700;white-space:nowrap}
.ucard .statbar{margin-top:auto}.ucard>.btn{width:100%}
.statbar i{display:block;height:100%;background:linear-gradient(90deg,#2aa7cf,#7de3ff)}
.sw{width:100%;aspect-ratio:2/1;border-radius:8px;border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 -10px 18px rgba(0,0,0,.35),inset 0 6px 10px rgba(255,255,255,.12)}
.set{display:flex;align-items:center;gap:.8em;padding:.45em 0;border-bottom:1px solid rgba(255,255,255,.05)}
.set>span{flex:0 0 9.5em;color:#c6d6e4}
.set input[type=range]{flex:1;accent-color:#7de3ff;min-width:80px;height:2em;touch-action:pan-y}@media (pointer:coarse){#ui input[type=range]{height:2.8em}}
.set b{flex:0 0 3.2em;text-align:right;color:#fff;font-weight:600}
.seg{display:flex;gap:.35em;flex-wrap:wrap;flex:1}
input[type=text],textarea{font-family:inherit;font-size:1em;color:#fff;background:rgba(4,10,18,.75);border:1px solid var(--ln);border-radius:8px;padding:.6em .7em;width:100%;user-select:text;-webkit-user-select:text}
textarea{min-height:11em;font-family:ui-monospace,Consolas,monospace;font-size:.75em;resize:vertical}
.help h3{margin-top:1em}
.help table{border-collapse:collapse;width:100%;font-size:.9em}
.help td{padding:.28em .5em;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top}
.help td:first-child{color:var(--c);white-space:nowrap;font-weight:600}
.verdict{font-family:Orbitron,sans-serif;font-weight:900;font-size:clamp(26px,6vmin,56px);letter-spacing:.16em}
.verdict.w{color:#fff;text-shadow:0 0 26px rgba(125,227,255,.7)}
.verdict.l{color:var(--red);text-shadow:0 0 26px rgba(255,90,70,.5)}
.lore{border-left:3px solid var(--c);padding:.2em 0 .2em .8em;color:#c2d3e2;font-style:italic}
#toast{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);z-index:9;background:rgba(10,20,32,.92);border:1px solid var(--c);border-radius:10px;padding:.6em 1.1em;font-family:Orbitron,sans-serif;font-size:.78em;letter-spacing:.1em;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#tip{position:fixed;left:0;top:0;z-index:10000;max-width:330px;padding:.7em .85em;border:1px solid rgba(125,227,255,.45);border-radius:9px;background:rgba(6,12,20,.97);color:#dff2ff;font:600 .84em/1.4 "Exo 2",sans-serif;box-shadow:0 10px 26px rgba(0,0,0,.55),0 0 18px rgba(125,227,255,.12);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;pointer-events:none}
#tip.on{opacity:1;transform:none}
#toast.on{opacity:1}
#rot{position:fixed;left:0;top:0;width:100%;height:100%;z-index:50;background:#05070c;display:none;align-items:center;justify-content:center;text-align:center;padding:2em}
#rot b{display:block;font-family:Orbitron,sans-serif;font-size:1.3em;letter-spacing:.2em;color:#7de3ff;margin-bottom:.6em}
#rot span{color:#8296a8}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#ui.in .scr>*{animation:fadeUp .32s ease both}#ui.in .scr>*:nth-child(2){animation-delay:.05s}#ui.in .scr>*:nth-child(3){animation-delay:.1s}#ui.in .scr>*:nth-child(n+4){animation-delay:.15s}
.btn{position:relative;overflow:hidden}
.btn:after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.18),transparent);transform:skewX(-20deg);transition:left .45s;pointer-events:none}
.btn:hover:after{left:120%}
.card{transition:transform .15s,border-color .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px)}
@keyframes pop{0%{transform:scale(0) rotate(-40deg);opacity:0}70%{transform:scale(1.35)}100%{transform:none;opacity:1}}
.stars.big b{display:inline-block;font-weight:400;animation:pop .5s cubic-bezier(.3,1.4,.5,1) both}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(125,227,255,.6)}50%{box-shadow:0 0 0 6px rgba(125,227,255,0)}}
.mis.next{border-color:var(--c);animation:pulse 1.4s infinite}

 if(!Array.isArray(save.wSeen)){save.wSeen=now;const lo=(Array.isArray(save.loadout)?save.loadout:[]).filter(x=>+x>0&&wUnlocked(+x));if(lo.length<slotCount()&&!lo.includes(3))lo.push(3);save.loadout=lo;persist();return;}
 const nw=now.filter(i=>!save.wSeen.includes(i));if(!nw.length)return;save.wSeen=now;
 const lo=Array.isArray(save.loadout)?save.loadout.filter(x=>+x>0):[];for(const i of nw)if(lo.length<slotCount()&&!lo.includes(i))lo.push(i);save.loadout=lo;persist();
 toast('WEAPON UNLOCKED: '+nw.map(i=>WEAPONS[i].n).join(' + ')+(lo.some(x=>nw.includes(x))?' · fitted':' · fit it in your loadout'));sfx('power');
}

 if(p.sing<=0){sfx('deny');msg('NO SINGULARITY CHARGES',90);return;}

function stepSing(){
 for(let i=singularities.length-1;i>=0;i--){
  const g=singularities[i];g.t++;
  const grow=.35+.65*Math.min(1,g.t/40),fade=g.life<50?g.life/50:1,R=g.r*grow*fade;
  if(--g.life<=0){singularities.splice(i,1);continue;}
  for(const s of ships){
   if(s.dead)continue;
   if(s.isPlayer&&!g.hostile)continue;
   const dx=g.x-s.x,dy=g.y-s.y,d=Math.hypot(dx,dy);
   if(d>R||d<1)continue;
   const same=s.team===g.team,q=1-d/R;
   if(g.hostile||same){const f=q*(g.hostile?.12:.2);s.vx+=dx/d*f;s.vy+=dy/d*f;}
   else{
    /* build 90: your singularity grabs hard. Pull rises toward the centre, engines are dragged (slowed) while
       inside, and inside 45% of the radius ships are held: their speed bleeds off and they are drawn to the core.
       Pull strength: bosses 35%, elites 65%, big hulls 80%; the core hold uses the square of that (bosses 12%), so bosses can still burn out. */
    const res=s.boss?.35:s.elite?.65:(s.r>34?.8:1),f=(.12+.55*q)*res;

   }

    dmg*=1+(M.lv||0)*.02+(g.pw||0)*.025;

   }
  }
  if(g.t%5===0)spark(g.x+rand(-R*.45,R*.45),g.y+rand(-R*.45,R*.45),g.z,0,0,0,18,3,'#b06bff',0);
 }
}

/* build 93: black holes hurt at every altitude (climbing used to dodge them, and Pilot Assist auto-climb did that for you).
   Core (inside 1.08 x radius): 0.6% of the ship's full hull + shield per frame. Tidal ring (1.08-1.7 x radius): up to 0.15%
   per frame, fading out. The player's share is scaled by difficulty (Cadet 0.7, Pilot 1, Ace 1.4) and +5% per sector;
   bosses take 40%. Freighters are spared. */

function collide(){

   const gd=Math.hypot(g.x-s.x,g.y-s.y);
   if(gd>g.r+s.r)continue;
   const surf=Math.sqrt(Math.max(0,g.r*g.r-gd*gd));
   if(s.z*140>surf+s.r*.4)continue;

  if(s.dead)continue;

     damage(b,(imp*(2+a.maxHp*.018)+a.ramB)*b.ramRes*(aRam?1:.5),a,{ram:true});

 };
 /* build 90: planets are always steered around (no flying over them), from further out, and a ship that is already
    close turns to skim past instead of ploughing in. Black holes keep the old check with a wider margin. */
 for(const g of gravityWells){
  if(g.bh){test(g,g.r*1.7,0);continue;} /* build 93: AI gives black holes (and their tidal ring) a wide berth at any altitude */
  const ox=g.x-s.x,oy=g.y-s.y,R=g.r+s.r,gap=Math.hypot(ox,oy)-R,fwd=ox*chh+oy*shh,lat=ox*shh-oy*chh,sd=lat>0?1:-1;

  const L=look+150;if(gap>L||fwd<0)continue;

 }
 for(const r of rocks)test(r,r.r,r.moon?.65:.35);

function aiPick(s,foes){

 for(const f of foes){
  if(f.dead)continue;let d=Math.hypot(f.x-s.x,f.y-s.y);
  if(s.team===0&&player&&!player.dead&&Math.hypot(f.x-player.x,f.y-player.y)>1250)continue;
  if(s.team===1){if(f.cargo)d*=.6;else if(f.isPlayer)d*=.92;}else if(f.marked||f.boss)d*=.8;
  if(d<bs){bs=d;best=f;}

function rangeSpawn(count,around){

 for(let i=0;i<want;i++){
  let x=0,y=0,ok=false;
  for(let k=0;k<28;k++){
   const a=Math.random()*TAU,d=190+Math.random()*330;

   if(Math.abs(x)>WORLD_HALF-120||Math.abs(y)>WORLD_HALF-120)continue;
   let clear=true;
   for(const g of gravityWells)if(Math.hypot(x-g.x,y-g.y)<g.r+120){clear=false;break;}
   if(clear)for(const r of rocks)if(Math.hypot(x-r.x,y-r.y)<r.r+80){clear=false;break;}
   if(clear)for(const st of stations)if(Math.hypot(x-st.x,y-st.y)<st.aura+100){clear=false;break;}
   if(clear){ok=true;break;}
  }

 help(){
  return'<div class="scr">'+hdr('Flight Manual')+'<div class="manualnav">'+[['controls','Controls'],['flight','Flight'],['weapons','Weapons'],['stations','Stations'],['missions','Missions'],['hangar','Hangar']].map(function(x){return '<button class="btn sm" data-a="jump" data-v="'+x[0]+'">'+x[1]+'</button>';}).join('')+'</div>'+'<div class="panel help">'+
  '<h3 style="margin-top:0">Your commission</h3><p>You hunt the renegade <b>Halvard Kray</b> through 10 sectors of 50 missions each. Every 10th mission is a boss; mission 50 is the sector captain. Clear a mission to open the next. Faster clears earn more stars. Progress is kept separately for Cadet, Pilot and Ace.</p>'+
  '<h3 id="sec-controls">Keyboard &amp; mouse — diorama</h3><table>'+
  '<tr><td>W / S</td><td>Thrust forward / reverse</td></tr><tr><td>A / D</td><td>Yaw left / right (the ship banks into turns)</td></tr>'+
  '<tr><td>Space</td><td>Fire. The laser shoots the moment you press; hold for rapid pulses, with a heavy beam each time the charge ring fills</td></tr>'+
  '<tr><td>C / wheel / 1–6</td><td>Cycle or pick weapon</td></tr><tr><td>7 / 8</td><td>Ability 1 (flares) / Ability 2 (overcharge)</td></tr><tr><td>V</td><td>Toggle vulcan auto-fire</td></tr><tr><td>G</td><td>Flak burst (also detonates enemy plasma)</td></tr>'+
  '<tr><td>Shift</td><td>Space brake</td></tr><tr><td>Q</td><td>Afterburner (builds heat; overheating locks it)</td></tr><tr><td>R</td><td>Climb. Release to sink back</td></tr>'+
  '<tr><td>E / click</td><td>Aim assist: lock the nearest enemy, or click one to lock it</td></tr><tr><td>F</td><td>Brace: halve incoming damage for a moment</td></tr><tr><td>Z / X</td><td>Barrel roll left / right: a sideways dash that shots pass through</td></tr>'+
  (view3D()?'<tr><td>B</td><td>Cycle view: diorama → cockpit → tail (3D only)</td></tr>':'')+'<tr><td>M</td><td>Large map</td></tr><tr><td>H</td><td>This manual</td></tr><tr><td>Esc / P</td><td>Pause</td></tr></table>'+
  '<h3>Xbox gamepad</h3><table><tr><td>Left stick</td><td>Steer toward the stick, thrust with deflection</td></tr><tr><td>A / B / X / Y</td><td>Fire / flak / vulcan auto / lock target</td></tr><tr><td>LB · RB</td><td>Cycle weapons</td></tr><tr><td>LT · RT</td><td>Brake · afterburner</td></tr><tr><td>L3 · R3</td><td>Climb · brace</td></tr><tr><td>D-pad ◀ ▶</td><td>Barrel roll</td></tr><tr><td>D-pad ▲ · ▼</td><td>Ability 1 (flares) · Ability 2 (overcharge)</td></tr><tr><td>Start</td><td>Pause</td></tr></table>'+
  (view3D()?'<h3>Cockpit controls (3D)</h3><table><tr><td>W / S</td><td>Pitch nose up / down</td></tr><tr><td>A / D</td><td>Yaw left / right</td></tr><tr><td>R / F</td><td>Throttle up / down — starts at zero</td></tr><tr><td>Q / Shift</td><td>Afterburner / brake</td></tr><tr><td>Space</td><td>Fire</td></tr><tr><td>Z / X</td><td>Barrel roll</td></tr><tr><td>B</td><td>Cycle view: cockpit → tail → diorama</td></tr></table>':'<p class="dim sml">Classic 2D is the diorama scheme: W/S thrust, A/D turn, R climb and F brace. Cockpit pitch and throttle are 3D-only.</p>')+
  '<h3>Touch</h3><p>Left stick steers and thrusts. Buttons: FIRE, WPN (tap to cycle; swipe left/right to move through weapons), FLAK, SHLD (brake + brace), ROLL, AIM (shown when Auto-aim is off), BURN, VULC, CLIMB'+(view3D()?', the eye (view cycle)':'')+' and pause. Tap an enemy to lock it, tap the minimap to enlarge it. With Pilot assist on, Auto-aim can be toggled in Settings → Auto; when it is on the AIM button is hidden. Rearrange everything in Settings → Touch layout editor (drag, mirror, resize, fixed or floating stick); the layout is saved per pilot.</p>'+
  '<h3 id="sec-flight">Flight</h3><p>Ships drift: thrust adds speed along your heading and friction is mild, so brake or counter-thrust to stop. <b>Altitude</b> matters: above 35% you clear asteroids, above 65% you clear moons and planets. Planets are <b>gravity wells</b> that pull ships and bend ion and plasma shots. <b>Ramming</b> hurts both ships by closing speed; the Hull upgrade adds ram damage and the Reactive mod softens impacts. Your <b>shield</b> absorbs damage first and starts recharging 5 seconds after the last hit. Pilot Assist auto-climbs over obstacles, damps sideways drift, and (with Auto countermeasures on) fires flak at incoming plasma and pops flares at inbound missiles.</p>'+(view3D()?'<p><b>Views (B / eye button):</b> cycles <b>diorama → cockpit → tail</b>. Cockpit is full 3D — W/S or the stick pitches the nose, A/D yaws, R/F sets throttle. Tail flies exactly the same 3D model from a chase camera outside the hull; floating yaw by default (set Fixed in Systems → Optics for a rigid mount).</p>':'<p><b>View cycling is a 3D/diorama control.</b> Classic 2D always uses the diorama.</p>')+'<p><b>Pilot Assist</b> can auto-lock the nearest hostile and turn onto its lead, auto-climbs obstacles, fires flak at incoming plasma, pops flares at inbound missiles, braces against hits and barrel-rolls to dodge. Auto-aim has its own toggle in Settings → Auto; the AIM touch button is hidden only while it is on. <i>Hide assisted buttons</i> hides the matching touch buttons for the assists you leave on.</p>'+
  '<h3 id="sec-weapons">Weapons</h3><table>'+
  '<tr><td colspan="2" class="dim sml">Unlocks: LASER and VULCAN from the start · ION Sector 2 · PLASMA Sector 3 · MISSILE Sector 4 · SING Sector 5.</td></tr>'+
  '<tr><td style="color:#7de3ff">LASER</td><td>Instant hit, range 1150, with a wider auto-aim cone than other weapons; cyan brackets mark the ship your next shot will hit. Tap for a pulse; hold for 3 pulses a second plus a charged beam whenever the ring fills. The Weapons upgrade raises its fire rate (up to 5 a second) and charge speed.</td></tr>'+
  '<tr><td style="color:#c87dff">ION</td><td>Fast bolt that slows the target. Bends in gravity.</td></tr>'+
  '<tr><td style="color:#ff7043">PLASMA</td><td>Slow heavy bolt that burns over time. Limited charges, restocked by docking.</td></tr>'+
  '<tr><td style="color:#ffd700">VULCAN</td><td>Bullet stream, best inside 380 m. Overheats. V lets it fire by itself.</td></tr>'+
  '<tr><td style="color:#ffb36b">MISSILE</td><td>Guided warhead: homes on your lock or the nearest hostile, 29+ damage with a small splash. Rack holds 4 per sortie and rearms while you dock or from missile pickups. Carry it in a loadout slot.</td></tr>'+
  '<tr><td style="color:#b06bff">SING</td><td>Singularity bomb: a 215 m well that drags ships in, slows their engines and holds them at the core, where it grinds hardest (up to 2.5× damage at the centre) — bosses resist part of the pull, allies take a light pull and 25% damage. One charge a mission once you reach Sector 5; rare purple pickups add charges. Captains, elites and bosses can throw one back at you.</td></tr></table>'+
  '<p><b>Ammo fallback:</b> when plasma, missile or singularity charges run out, the weapon selector automatically returns to your main lasers. Main lasers are permanent and sit outside the loadout; ammo pickups are filtered to the secondary weapons actually fitted.</p>'+
  '<p><b>Flak</b> is a point-defence countermeasure, not a slot weapon: it bursts automatically at incoming plasma when the assist is on, or on G. Nine pellets, 8 s cooldown.</p>'+
  '<p>Shots auto-aim at targets inside your <b>fire arc</b> (widen it with the Fire Arc upgrade). A ghost diamond shows where ion and plasma will land. Targeting upgrades add critical hits, shown in gold.</p>'+
  '<h3 id="sec-stations">Stations</h3><p>Each side may hold a station with three turrets. Its <b>defense field</b> (the ring) burns enemy ships inside it and reduces damage to friends inside by 35%. Park inside your own ring to <b>dock</b>: hull repairs, shields recharge and plasma restocks.</p>'+
  '<h3 id="sec-missions">Missions</h3><table>'+
  '<tr><td>⚔ Battle</td><td>Destroy every hostile ship and the enemy station.</td></tr><tr><td>➤ Escort</td><td>Guard the freighter to the green beacon. It halts while enemies are close.</td></tr>'+
  '<tr><td>◎ Hunted</td><td>Kill the golden marked ship.</td></tr><tr><td>▣ Defend</td><td>Survive three waves of rammers aimed at your station.</td></tr>'+
  '<tr><td>✹ Total War</td><td>Battle against a station with +50% armour, +25% pay.</td></tr><tr><td>☠ Boss</td><td>Kill the captain, the escort and the station.</td></tr><tr><td>∞ Hunt</td><td>Free mode from the Hangar: reach the kill target.</td></tr></table>'+
  '<p>Weather: <b>ion storms</b> telegraph EMP strikes with a ring — leave it or lose your shields; <b>dust fog</b> cuts visibility.</p>'+
  '<p><b>Streaks:</b> kills within 5.5 seconds of each other build a streak worth +10% bounty each, up to +100%. <b>Elites</b> (purple) are tougher, hit harder and always drop a powerup. Bosses call reinforcements at half hull.</p>'+'<h3 id="sec-pickups">Pickups</h3><p>Wrecks and asteroids drop flotsam: gold (credits), green (repair), blue (coolant). Powerups: Medkit, Plasma restock, speed Boost, Damage ×1.5, Shield overcharge, Gold — and rarely a Singularity charge.</p>'+
  '<h3 id="sec-hangar">Hangar</h3><p>Spend credits on upgrades, new ships (15 classes across Scout, Fighter and Defender), per-ship mods, hull colours and engine trails. Wingmates fly ships of your class tier. Deeds pay bonus credits. Export a pilot as text from Pilot Select to back it up or move it.</p><p><b>Each difficulty is its own career:</b> Cadet, Pilot and Ace keep separate upgrades, ships, mods, cosmetics and campaign progress. Upgrade ceilings are 20 / 40 / 60 levels per track, opened up as you advance: each sector you reach on that difficulty raises the limit by 2 / 4 / 6 levels, and the heavier ships, mods and finishes require the higher difficulty — a fully upgraded Cadet ship cannot carry you through Ace. Switching difficulty in the Hangar swaps your whole loadout; each difficulty also has its own credit wallet, so earnings on Cadet cannot fund an Ace run.</p></div></div>';

function fmtNum(n){return Math.round(n).toLocaleString('en-US');}

function contractKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function contractList(){
 const key=contractKey();let seed=7;for(let i=0;i<key.length;i++)seed=(seed*31+key.charCodeAt(i))>>>0;
 const rng=mulberry32(seed),pool=['battle','escort','hunted','defend','totalwar','recon'];
 const modPool=[['NOSHIELD','NO SHIELDS'],['RAMMERS','+2 RAMMERS'],['ION','ION STORM'],['GLASS','+30% DAMAGE TAKEN']],out=[];
 for(let i=0;i<3;i++){
  const mode=pool[(rng()*pool.length)|0],mods=[],n=1+(rng()<.5?1:0);
  while(mods.length<n){const m=modPool[(rng()*modPool.length)|0];if(!mods.some(x=>x[0]===m[0]))mods.push(m);}
  out.push({i,key,mode,mods,pay:+(1.35+n*.3).toFixed(2),lv:Math.min(500,Math.max(3,reachedOf(save)+(i+1)*4))});
 }
 return out;
}
/* build 91: recon relays must sit in open space a ship can actually park on (not inside a planet, moon, black hole or station). */
function reconClear(x,y){for(const g of gravityWells)if(Math.hypot(g.x-x,g.y-y)<g.r*(g.bh?1.6:1)+170)return false;for(const r of rocks)if(r.moon&&Math.hypot(r.x-x,r.y-y)<r.r+130)return false;for(const s of stations)if(Math.hypot(s.x-x,s.y-y)<(s.r||60)+190)return false;for(const n of (M.scanNodes||[]))if(Math.hypot(n.x-x,n.y-y)<300)return false;return true;}
function applyContract(c){
 M.contract=c;
 if(c.mods.some(m=>m[0]==='NOSHIELD')){player.maxSh=player.sh=0;}
 if(c.mods.some(m=>m[0]==='GLASS'))M.dmgTaken=1.3;
 if(c.mods.some(m=>m[0]==='ION'))M.ionStorm=true;
 if(c.mods.some(m=>m[0]==='RAMMERS')){for(let i=0;i<2;i++){const e=spawnEnemy(0,player.x+rand(-260,260),player.y+rand(-260,260),rand(TAU),{ram:true});if(e){e.maxHp=e.hp=Math.round(e.maxHp*1.3);}}}
 if(c.mode==='recon'){M.scanNodes=[];M.detected=0;const rn=Math.max(1,M.scanTotal||3);for(let i=0;i<rn;i++){let x=0,y=0;for(let k=0;k<40;k++){const a=rand(TAU),d=420+i*230+(k>20?rand(-150,250):0);x=clamp(player.x+Math.cos(a)*d,-WORLD_HALF+150,WORLD_HALF-150);y=clamp(player.y+Math.sin(a)*d,-WORLD_HALF+150,WORLD_HALF-150);if(reconClear(x,y))break;}M.scanNodes.push({x,y,prog:0,done:false});}}
 msg('CONTRACT: '+c.mods.map(m=>m[1]).join(' · '),110);
}

function checkDeeds(r){
 const got=[];r=r||{};
 const ev={nohit:r.win&&r.noHit,flawless:r.win&&r.noHit&&r.stars===3,swift:r.win&&r.secs<20,swift15:r.win&&r.secs<15};
 for(const d of DEEDS){if(save.ach[d.id])continue;let ok=ev[d.id];if(ok===undefined){const p=deedProg(d.id);ok=!!p&&p[0]>=p[1];}if(ok){save.ach[d.id]=1;dGoldAdd(save,d.g);got.push(d);}}

function showEnd(){
 const m=M,win=m.win,hunt=m.hunt,secs=m.clock/60;let stars=0,reward=0,deeds=[];const sqLost=Math.max(0,m.wingLost||0);if(sqLost>0&&!save.free&&!m.tutOn){save.sq[save.diff]=Math.max(0,(save.sq[save.diff]|0)-sqLost);save.memorial=(save.memorial||0)+sqLost;persist();}

  save.squadXP=(save.squadXP||0)+stars*60;save.squadLvl=1+Math.floor(save.squadXP/400);

  const c=save.cnt;dGoldAdd(save,total);c.gold+=total;c.voy++;
  if(hunt)c.hunt=Math.max(c.hunt,m.kills);
  if(win){

   if(!hunt){const o=save.prog.campaign[m.diff],old=o[m.lv]?o[m.lv].stars:0;if(stars>old)o[m.lv]={stars};let n=0;for(let s=0;s<10;s++)if(sectorCleared(s,m.diff))n++;c.sectors=Math.max(c.sectors,n);}

 transparent:true,blending:THREE.AdditiveBlending,depthWrite:false});
const points=new THREE.Points(pGeo,pMat);points.frustumCulled=false;scene.add(points);
const flashes=[];for(let i=0;i<3;i++){const l=new THREE.PointLight(0xffc890,0,1400,2);scene.add(l);flashes.push(l);}
const engL=new THREE.PointLight(0xffffff,0,700,2);scene.add(engL);
const DN=700,dBase=new Float32Array(DN*3),dPos=new Float32Array(DN*3),dCol=new Float32Array(DN*3),dSz=new Float32Array(DN),dGeo=new THREE.BufferGeometry();
{const r=mulberry32(5);for(let i=0;i<DN;i++){dBase[i*3]=r()*3600;dBase[i*3+1]=-150+r()*300;dBase[i*3+2]=r()*3600;const b=.1+r()*.28;dCol[i*3]=b*.8;dCol[i*3+1]=b*.95;dCol[i*3+2]=b*1.2;dSz[i]=2+r()*5;}}
dGeo.setAttribute('position',new THREE.BufferAttribute(dPos,3).setUsage(THREE.DynamicDrawUsage));dGeo.setAttribute('pcol',new THREE.BufferAttribute(dCol,3));dGeo.setAttribute('psize',new THREE.BufferAttribute(dSz,1));
const dust=new THREE.Points(dGeo,pMat);dust.frustumCulled=false;scene.add(dust);
function updDust(tx,tz){for(let i=0;i<DN;i++){const j=i*3;dPos[j]=tx+((((dBase[j]-tx)%3600)+3600)%3600)-1800;dPos[j+1]=dBase[j+1];dPos[j+2]=tz+((((dBase[j+2]-tz)%3600)+3600)%3600)-1800;}dGeo.attributes.position.needsUpdate=true;}
const SHOT={ion:[10,4.5,4.5,2.4],plasma:[12,8.5,8.5,2.2],vulcan:[11,1.6,1.6,2.6],flak:[4.5,2.6,2.6,2.2],msl:[16,3,3,2.6],turret:[11,2.3,2.3,2.4]};
function effects(){
 let n=0;
 for(const p of projectiles){if(n>=MAXS)break;const k=SHOT[p.type]||SHOT.turret,c=crgb(p.col);dummy.position.set(p.x,p.z*ALT,p.y);dummy.rotation.set(0,-Math.atan2(p.vy,p.vx),0);dummy.scale.set(k[0],k[1],k[2]);dummy.updateMatrix();shotM.setMatrixAt(n,dummy.matrix);shotM.setColorAt(n,C.setRGB(c[0]*k[3]+.25,c[1]*k[3]+.25,c[2]*k[3]+.25));n++;}
 shotM.count=n;shotM.instanceMatrix.needsUpdate=true;if(shotM.instanceColor)shotM.instanceColor.needsUpdate=true;
 n=0;
 for(const b of beams){if(n>=MAXB)break;const f=b.life/b.max;V.set(b.x1,b.z1*ALT,b.y1);V2.set(b.x2,b.z2*ALT,b.y2);const len=V.distanceTo(V2);if(len<.01)continue;
  dummy.position.copy(V).add(V2).multiplyScalar(.5);V2.sub(V).normalize();dummy.quaternion.setFromUnitVectors(XA,V2);const w=b.w*(.5+f*.9);dummy.scale.set(len,w,w);dummy.updateMatrix();beamM.setMatrixAt(n,dummy.matrix);const k=f*3;beamM.setColorAt(n,C.setRGB(b.r*k+f*.6,b.g*k+f*.6,b.b*k+f*.6));n++;}
 dummy.quaternion.identity();dummy.rotation.set(0,0,0);
 beamM.count=n;beamM.instanceMatrix.needsUpdate=true;if(beamM.instanceColor)beamM.instanceColor.needsUpdate=true;
 let nr=0,nd=0,np=0,nf=0;
 for(const l of flashes)l.intensity=0;
 for(const p of particles){
  const f=p.life/p.max,y=p.z*ALT;
  if(p.type===1){if(nr<MAXR){const R=p.size*(1-f)+1;dummy.position.set(p.x,y+2,p.y);dummy.rotation.set(0,0,0);dummy.scale.set(R,1,R);dummy.updateMatrix();ringM.setMatrixAt(nr,dummy.matrix);ringM.setColorAt(nr,C.setRGB(p.r*f*1.8,p.g*f*1.8,p.b*f*1.8));nr++;}}
  else if(p.type===3){if(nd<MAXD){dummy.position.set(p.x,y,p.y);dummy.rotation.set(p.rot,p.rot*.7,p.rot*1.3);const s=p.size*Math.min(1,f*3);dummy.scale.set(s,s,s);dummy.updateMatrix();debM.setMatrixAt(nd,dummy.matrix);nd++;}}
  else{
   if(p.type===4&&nf<flashes.length){const l=flashes[nf++];l.position.set(p.x,y+40,p.y);l.color.setRGB(p.r,p.g,p.b);l.intensity=f*p.size*900;}
   if(np<MAXP){const i=np*3,k=p.type===2?f*.22:p.type===4?f*.5:f*1.7;pPos[i]=p.x;pPos[i+1]=y;pPos[i+2]=p.y;pCol[i]=p.r*k;pCol[i+1]=p.g*k;pCol[i+2]=p.b*k;pSize[np]=p.type===2?p.size*(2.6-f):p.type===4?p.size*1.3:p.size*(1+f)*1.25;np++;}
  }
 }
 dummy.rotation.set(0,0,0);
 ringM.count=nr;ringM.instanceMatrix.needsUpdate=true;if(ringM.instanceColor)ringM.instanceColor.needsUpdate=true;
 debM.count=nd;debM.instanceMatrix.needsUpdate=true;
 pGeo.setDrawRange(0,np);pGeo.attributes.position.needsUpdate=true;pGeo.attributes.pcol.needsUpdate=true;pGeo.attributes.psize.needsUpdate=true;
}

/* ---------- state sync: create on first sight, update, sweep + dispose ---------- */
const maps={ship:new Map(),st:new Map(),pl:new Map(),rk:new Map(),fl:new Map(),pu:new Map(),wr:new Map()};
let frameNo=0;
function sync(map,list,make,upd){
 for(const it of list){if(it.dead)continue;let o=map.get(it);if(!o){o=make(it);map.set(it,o);scene.add(o.o);}o.seen=frameNo;if(upd)upd(o,it);}
 for(const e of map){const o=e[1];if(o.seen!==frameNo){scene.remove(o.o);if(o.own)for(const d of o.own)d.dispose();map.delete(e[0]);}}
}

/* ---------- post-processing ---------- */
const TiltShader={
 uniforms:{tDiffuse:{value:null},dir:{value:new THREE.Vector2(1,0)},res:{value:new THREE.Vector2(1920,1080)},maxR:{value:12},fin:{value:0},tm:{value:0}},
 vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
 fragmentShader:[
 'uniform sampler2D tDiffuse;uniform vec2 dir;uniform vec2 res;uniform float maxR;uniform float fin;uniform float tm;varying vec2 vUv;',
 'float rnd(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}',
 'void main(){',
 ' float d=abs(vUv.y-0.5);',
 ' float r=maxR*smoothstep(0.13,0.5,d);',
 ' float sp=r/6.0;',
 ' float j=rnd(vUv*res+dir*17.0)-0.5;',
 ' vec4 acc=vec4(0.0);float ws=0.0;',
 ' for(int i=-6;i<=6;i++){float fi=float(i);float w=1.0-abs(fi)/7.0;acc+=texture2D(tDiffuse,vUv+dir*(fi+j)*sp/res)*w;ws+=w;}',
 ' vec4 c=acc/ws;',
 ' if(fin>0.5){float l=dot(c.rgb,vec3(0.2126,0.7152,0.0722));c.rgb=max(vec3(0.0),mix(vec3(l),c.rgb,1.32));c.rgb=max(vec3(0.0),(c.rgb-0.18)*1.07+0.18);vec2 q=vUv-0.5;c.rgb*=1.0-dot(q,q)*0.6;float ca=dot(q,q)*0.006;c.r=mix(c.r,texture2D(tDiffuse,vUv+q*ca).r,0.6);c.b=mix(c.b,texture2D(tDiffuse,vUv-q*ca).b,0.6);c.rgb=max(vec3(0.0),c.rgb+(rnd(vUv*res+tm)-0.5)*0.02);}',
 ' gl_FragColor=c;',
 '}'].join('\n')
};
let composer=null,tiltH=null,tiltV=null,curQ='',curPR=0,curW=0,curH=0,curMission=-1;
function sizeUniforms(){
 const sz=renderer.getDrawingBufferSize(new THREE.Vector2());
 for(const t of[tiltH,tiltV]){t.uniforms.res.value.set(sz.x,sz.y);t.uniforms.maxR.value=12*sz.y/1080;}
 pMat.uniforms.sc.value=sz.y/(2*Math.tan(HALF_FOV));
 const e=Math.max(W,H)*.8+320,sc=sun.shadow.camera;sc.left=-e;sc.right=e;sc.top=e;sc.bottom=-e;sc.updateProjectionMatrix();
}
function build(q){
 if(composer){for(const p of composer.passes)if(p.dispose)p.dispose();composer.dispose();}
 renderer.setPixelRatio(curPR);renderer.setSize(cw,ch,false);
 const rt=new THREE.WebGLRenderTarget(cw,ch,{type:THREE.HalfFloatType,samples:q==='high'?4:0});
 composer=new EffectComposer(renderer,rt);
 composer.addPass(new RenderPass(scene,cam));
 if(q==='high'){const sz=renderer.getDrawingBufferSize(new THREE.Vector2());composer.addPass(new UnrealBloomPass(sz,.6,.5,1.0));}
 tiltH=new ShaderPass(TiltShader);tiltV=new ShaderPass(TiltShader);tiltH.uniforms.dir.value.set(1,0);tiltV.uniforms.dir.value.set(0,1);tiltV.uniforms.fin.value=1;
 composer.addPass(tiltH);composer.addPass(tiltV);composer.addPass(new OutputPass());
 composer.setSize(cw,ch);
 sun.castShadow=q==='high';debM.castShadow=q==='high';
 sizeUniforms();
}
function checkQuality(){
 const q=settings.gfx==='low'?'low':'high',pr=Math.max(.3,pixRatio());
 if(q!==curQ||!composer){curQ=q;curPR=pr;curW=cw;curH=ch;build(q);return;}
 if(Math.abs(pr-curPR)>.001||cw!==curW||ch!==curH){curPR=pr;curW=cw;curH=ch;renderer.setPixelRatio(pr);renderer.setSize(cw,ch,false);composer.setPixelRatio(pr);composer.setSize(cw,ch);sizeUniforms();}
}
function placeCam(){
 const d=H/(2*Math.tan(HALF_FOV)),tx=camX+W/2,tz=camY+H/2;
 cam.aspect=W/H;cam.position.set(tx,d*Math.sin(PITCH),tz+d*Math.cos(PITCH));cam.lookAt(tx,0,tz);cam.updateProjectionMatrix();cam.updateMatrixWorld(true);
 sun.position.set(tx-380,1250,tz+440);sun.target.position.set(tx,0,tz);sun.target.updateMatrixWorld();
 updDust(tx,tz);floor.position.x=Math.round(tx/3250)*3250;floor.position.z=Math.round(tz/3250)*3250;
}
const out={x:0,y:0},out2={x:0,y:0};
function w2sB(x,y,z){
 V.set(x,(z||0)*ALT,y).applyMatrix4(cam.matrixWorldInverse);
 if(V.z>-1){out.x=W/2+(x-camX-W/2)*3;out.y=H/2+(y-camY-H/2)*3;return out;}
 V.applyMatrix4(cam.projectionMatrix);out.x=(V.x*.5+.5)*W;out.y=(-V.y*.5+.5)*H;return out;
}
function s2wB(sx,sy){
 V.set(sx/W*2-1,-(sy/H*2-1),.5).unproject(cam).sub(cam.position).normalize();
 const t=V.y<-1e-4?-cam.position.y/V.y:0;out2.x=cam.position.x+V.x*t;out2.y=cam.position.z+V.z*t;return out2;
}
function render(){
 if(!M)return false;
 frameNo++;checkQuality();
 if(M.id!==curMission){curMission=M.id;setSector(M.sea);}
 placeCam();
 sync(maps.ship,ships,shipObj,updShip);sync(maps.st,stations,stationObj,updStation);sync(maps.pl,gravityWells,planetObj,updPlanet);
 sync(maps.rk,rocks,rockObj,updRock);sync(maps.fl,flotsams,flotObj,updFlot);sync(maps.pu,powerups,powObj,updPow);sync(maps.wr,wrecks,wreckObj,updWreck);
 effects();
 wellMat.uniforms.t.value=frameNo*.016;
 hemi.intensity=HEMI+(M.flash||0)*5;
 if(M.beacon){beacon.visible=true;beacon.position.set(M.beacon.x,-4,M.beacon.y);const k=1+Math.sin(frameNo*.07)*.08;beacon.children[0].scale.set(k,1,k);}else beacon.visible=false;
 tiltV.uniforms.tm.value=frameNo%97;
 if(player&&!player.dead){const pc=crgb(player.trail);engL.color.setRGB(pc[0],pc[1],pc[2]);engL.position.set(player.x-Math.cos(player.ang)*player.r*1.5,player.z*ALT+12,player.y-Math.sin(player.ang)*player.r*1.5);engL.intensity=Math.min(1.6,player.thr)*14000;}else engL.intensity=0;
 composer.render();

 return true;
}

/* ---------- dockyard preview (own small renderer, drawn into the card's 2D canvas) ---------- */
let pv=null,pvFail=false;const pvObjs=new Map();
function preview(el,idx,cols){
 if(pvFail)return false;
 try{
  if(!pv){
   const c=mkCanvas(624,384),r=new THREE.WebGLRenderer({canvas:c,antialias:true,alpha:true,powerPreference:'low-power'});
   r.setPixelRatio(1);r.setSize(624,384,false);r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.15;r.setClearColor(0x000000,0);
   const sc=new THREE.Scene(),pg=new THREE.PMREMGenerator(r);sc.environment=pg.fromScene(new RoomEnvironment(r),.04).texture;pg.dispose();
   sc.add(new THREE.HemisphereLight(0xa8c6ff,0x241a2c,1.6));const dl=new THREE.DirectionalLight(0xffe0bc,4.4);dl.position.set(-3,6,2.5);sc.add(dl);
   const pc=new THREE.PerspectiveCamera(30,416/256,.1,50);pc.position.set(0,2.5,4.9);pc.lookAt(0,-.05,0);
   const holder=new THREE.Group();sc.add(holder);pv={r,sc,pc,holder,c};
  }
  const key=idx+cols.hull+(cols.prism?'prism':cols.trail)+(settings.glow!==false?'g':'');let o=pvObjs.get(key);
  if(!o){
   if(pvObjs.size>40){for(const x of pvObjs.values())for(const d of x.own)d.dispose();pvObjs.clear();}
   o=shipObj({idx,hull:cols.hull,trail:cols.trail,isPlayer:true,prism:!!cols.prism,team:0,cargo:false,marked:false});pvObjs.set(key,o);
   for(const f of o.fl)f[0].scale.set(.7,f[1],f[1]);
  }
  pv.holder.clear();pv.holder.add(o.o);if(o.pr)prismPaint(o,cols.trail);
  const t=performance.now()*.0006+idx;o.o.rotation.y=t;o.b.rotation.x=Math.sin(t*1.3)*.18;o.o.scale.setScalar(.72+.24*SHIPS[idx].sc);
  pv.r.render(pv.sc,pv.pc);
  const x=el.getContext('2d');x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,el.width,el.height);x.drawImage(pv.c,0,0,el.width,el.height);
  return true;
 }catch(e){pvFail=true;return false;}
}

window.R3D={design:designShip,on:settings.gfx!=='classic',failed:false,ready:true,render,resize(){curW=-1;},w2s:w2sB,s2w:s2wB,preview};

}catch(e){if(window.console)console.warn('Parsec: 3D renderer unavailable, using classic 2D.',e);fail();}
